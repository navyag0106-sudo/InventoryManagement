<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In - InventoryPro ERP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" crossorigin="anonymous" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" crossorigin="anonymous" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
</head>
<body>

<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <div class="auth-logo">
                <i class="fas fa-boxes-stacked"></i>
            </div>
            <h2 class="auth-title">Welcome Back</h2>
            <p class="auth-subtitle">Sign in to your InventoryPro account</p>
        </div>

        <div class="auth-body">
            <div id="alertBox"></div>

            <form id="loginForm">
                <div class="mb-3">
                    <label class="form-label-custom" for="username">Username</label>
                    <div class="position-relative">
                        <input type="text" class="form-control-custom" id="username" placeholder="Enter your username" required autofocus>
                    </div>
                </div>

                <div class="mb-3">
                    <div class="d-flex justify-content-between align-items-center mb-1">
                        <label class="form-label-custom mb-0" for="password">Password</label>
                    </div>
                    <div class="input-group">
                        <input type="password" class="form-control-custom border-end-0" id="password" placeholder="Enter your password" required style="border-top-right-radius: 0; border-bottom-right-radius: 0;">
                        <button type="button" class="btn btn-outline-secondary border" id="togglePasswordBtn" style="border-color: var(--border-color) !important; border-top-left-radius: 0; border-bottom-left-radius: 0;">
                            <i class="fas fa-eye text-muted" id="toggleIcon"></i>
                        </button>
                    </div>
                </div>

                <button type="submit" class="btn-primary-custom w-100 justify-content-center py-2 mt-2" id="loginBtn">
                    <span id="btnText"><i class="fas fa-sign-in-alt me-2"></i> Sign In</span>
                    <span id="btnSpinner" class="spinner-border spinner-border-sm d-none" role="status"></span>
                </button>
            </form>


        </div>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js" crossorigin="anonymous"></script>
<script src="js/api.js"></script>
<script>
// Check if redirected due to expired session
const urlParams = new URLSearchParams(window.location.search);
if (urlParams.get('expired')) {
    showAlert('alertBox', 'Your session has expired. Please sign in again.', 'warning');
}

// Password toggle
const togglePasswordBtn = document.getElementById('togglePasswordBtn');
const passwordInput = document.getElementById('password');
const toggleIcon = document.getElementById('toggleIcon');

togglePasswordBtn.addEventListener('click', () => {
    const isPassword = passwordInput.getAttribute('type') === 'password';
    passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
    toggleIcon.className = isPassword ? 'fas fa-eye-slash text-primary' : 'fas fa-eye text-muted';
});

// Login form submit
document.getElementById('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    const username = document.getElementById('username').value.trim();
    const password = document.getElementById('password').value;
    
    const loginBtn = document.getElementById('loginBtn');
    const btnText = document.getElementById('btnText');
    const btnSpinner = document.getElementById('btnSpinner');

    loginBtn.disabled = true;
    btnText.classList.add('d-none');
    btnSpinner.classList.remove('d-none');

    try {
        const res = await apiRequest('/auth/login', 'POST', { username, password });
        setToken(res.token);
        setUser({
            userId: res.userId,
            username: res.username,
            fullName: res.fullName,
            role: res.role
        });

        showToast('Login successful! Redirecting...', 'success');
        setTimeout(() => {
            window.location.href = (res.role || '').toUpperCase() === 'ADMIN' ? 'dashboard.html' : 'products.html';
        }, 500);
    } catch (err) {
        loginBtn.disabled = false;
        btnText.classList.remove('d-none');
        btnSpinner.classList.add('d-none');
        showAlert('alertBox', err.message || 'Invalid username or password', 'danger');
    }
});
</script>
</body>
</html>
